home_faqs:
  - {p: "O que é o Estrato?", r: "Um portal sobre os Três Poderes que reúne dados oficiais abertos, como os da Câmara e do Senado, e resumos de fontes públicas com link para a íntegra."}
  - {p: "O Estrato apoia algum partido ou candidato?", r: "Não. O portal é apartidário: todas as páginas de parlamentares e partidos seguem o mesmo modelo, com dados oficiais e sem opinião."}
  - {p: "De onde vêm as notícias?", r: "Das agências oficiais, como Agência Câmara, Agência Senado, Agência Brasil, STF e TCU. Cada resumo leva crédito e link para o original."}
  - {p: "Com que frequência o site é atualizado?", r: "As notícias são coletadas a cada 30 minutos e os dados oficiais uma vez por dia."}
  - {p: "O Estrato publica pesquisas eleitorais?", r: "Não. O portal não publica pesquisas de intenção de voto nem conteúdo de campanha."}
