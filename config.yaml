# Pré-lançamento: noindex,nofollow em todas as páginas, robots Disallow e IndexNow desligado. Desligar só após 25/10/2026.
noindex_global: true
aviso_topo: "Versão de prévia: em revisão, não indexada."
publisher_logo: /static/logo.png
tema: {cor: "#8A4B08", cor2: "#6E3B05", escuro: "#1B2430"}
modulos: [core.modulos.glossario, parlamentares, partidos, votacoes, proposicoes, colegiados, cotas, emendas, executivo, financas, presidencia, perguntas, explica, agenda, linha_do_tempo, quem_e_quem, calendario, checagem, mapas, local, bairros, prefeitos, midia, dados_abertos, subcategorias]
qualidade:
  min_faqs: 5                 # hubs, institucionais e glossário
  min_palavras_pseo: 300
  corte_unicidade: 0.15       # fração mínima de texto próprio (5-gramas raros na família) para uma pSEO ficar indexável
  faq_sem_schema: [/termos/, /privacidade/, /contato/, /correcoes/]   # FAQ visível, mas sem FAQPage (rich result só vale para governo/saúde; ganho é só AEO nas páginas de dados)
  faq_pseo: {prefixos: [/deputados/, /senadores/, /proposicoes/, /comissoes/, /frentes/, /municipios/, /financas/], max: 3, hubs_exatos: [/municipios/, /financas/, /municipios/ac/, /municipios/al/, /municipios/ap/, /municipios/am/, /municipios/ba/, /municipios/ce/, /municipios/df/, /municipios/es/, /municipios/go/, /municipios/ma/, /municipios/mt/, /municipios/ms/, /municipios/mg/, /municipios/pa/, /municipios/pb/, /municipios/pr/, /municipios/pe/, /municipios/pi/, /municipios/rj/, /municipios/rn/, /municipios/rs/, /municipios/ro/, /municipios/rr/, /municipios/sc/, /municipios/sp/, /municipios/se/, /municipios/to/, /comissoes/camara/, /comissoes/senado/, /comissoes/cpis/], hubs: [/municipios/metodologia/, /deputados/uf/, /deputados/cota-parlamentar/, /proposicoes/tema/, /proposicoes/tipo/, /proposicoes/metodologia/, /comissoes/metodologia/]}   # partidos são hubs dos seus parlamentares: FAQ completo
# Lançamento em ondas (vale quando noindex_global for desligado). Plano:
#   onda 1 (lançamento): institucionais, editorias, glossário, partidos, hubs de deputados/senadores, deputados por UF e cota parlamentar
#   onda 2 (+2 a 3 semanas, se o Search Console mostrar a onda 1 indexada): tirar "senadores" da lista
#   onda 3 (+2 a 3 semanas): tirar "deputados" da lista
#   onda 4 (+2 a 3 semanas): tirar "votacoes" da lista (páginas de cada votação e listas anuais)
#   onda 5 (+2 a 3 semanas): tirar "cotas" da lista (cota por parlamentar, categoria e fornecedor; hub /cota/ e metodologia ficam indexáveis)
#   onda 6 (+2 a 3 semanas): tirar "emendas" da lista (emendas por autor e por município; hubs ficam indexáveis)
#   onda 8 (+2 a 3 semanas, uma de cada vez): prefeituras, verbas, representantes, eleitorado, perguntas_local; depois bairros (so as paginas que passarem no corte de unicidade); prefeitos so apos liberar a flag
#   onda 7 (+2 a 3 semanas): tirar "executivo" da lista (viagens de ministros, órgãos, Presidência; hubs ficam indexáveis)
indexacao:
  familias_noindex: [deputados, senadores, votacoes, proposicoes, comissoes, frentes, cotas, emendas, executivo, financas, municipios, prefeituras, verbas, representantes, eleitorado, perguntas_local, bairros, prefeitos, midia]   # votacoes: páginas de cada votação e listas anuais (hub /votacoes/ e metodologia ficam indexáveis)
  excecoes: [/deputados/, /senadores/, /deputados/cota-parlamentar/, "/deputados/uf/*", /proposicoes/, /proposicoes/tema/, /proposicoes/metodologia/, /comissoes/, /comissoes/camara/, /comissoes/senado/, /comissoes/cpis/, /comissoes/metodologia/, /frentes/]
