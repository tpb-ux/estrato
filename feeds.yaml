max_por_feed: 3
# Equilíbrio (14/10/2026): limite por fonte e por viés no dia; deduplicação entre fontes pelo título (Jaccard >= dedup_corte em dedup_dias).
# Viés declarado: oficial, mainstream, esquerda, direita, regional. Esquerda e direita têm o mesmo teto diário.
max_por_fonte_dia: 4
max_por_vies_dia: {esquerda: 6, direita: 6, mainstream: 14, regional: 6}
