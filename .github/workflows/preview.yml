# Prévia no GitHub Pages (tpb-ux.github.io/estrato) com noindex global. A produção roda na VPS (ops/ciclo.sh).
name: preview
on:
  push: {branches: [main]}
  workflow_dispatch:
permissions: {contents: read, pages: write, id-token: write}
concurrency: {group: pages, cancel-in-progress: false}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - name: Build (falha com link quebrado, FAQ < 5 ou título duplicado)
        env: {PORTAL_BASE_URL: "https://tpb-ux.github.io/estrato", PORTAL_NOINDEX: "1"}
        run: python build.py
      - uses: actions/upload-pages-artifact@v3
        with: {path: public}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: {name: github-pages, url: "${{ steps.d.outputs.page_url }}"}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
